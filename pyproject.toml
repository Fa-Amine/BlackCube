[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackcube-vault"
version = "0.7.0a1"
description = "Offline encrypted project vault with mandatory keyfile authentication and verified recovery"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44,<51",
    "PySide6>=6.8,<7",
    "pqcrypto>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
blackcube = "blackcube.app:main"
blackcube-cli = "blackcube.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["blackcube*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
blackcube = ["assets/*.png", "assets/*.svg", "assets/*.ico"]
